name: release

# A tag publishes; the manual run only builds and uploads an artifact, so the
# pipeline can be exercised without burning a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    # Must be a Windows runner: this builds an x64 DLL with premake + MSBuild
    # and needs the VS2022 C++ toolchain.  See docs/release.md for setting one
    # up -- a Linux runner cannot run this job at all.
    runs-on: windows

    steps:
      - uses: actions/checkout@v4

      - name: Package
        id: package
        shell: powershell
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          .\tools\package.ps1 -Version $version

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          # Injected by Gitea, scoped to this repository.
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\tools\publish-release.ps1 `
            -Tag "${{ steps.package.outputs.version }}" `
            -Zip "${{ steps.package.outputs.zip }}"
