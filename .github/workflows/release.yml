name: build-and-release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package
        id: package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          .\tools\package.ps1 -Version $version

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: |
          $install = @'
          解压到游戏根目录（`gakumas.exe` 所在处）：

          ~~~text
          <游戏目录>\xinput1_3.dll
          <游戏目录>\gakumas-mod\config.json
          ~~~

          已经装过的直接覆盖 `xinput1_3.dll` 即可。
          '@
          # 更新说明取 annotated tag 的注解正文（首行主题，空行后是面向用户的 "- " 变动列表，
          # 与 gakumas-modding 同一套写法），末尾固定指向 CHANGELOG；tag 没写注解才退回
          # CHANGELOG 里本版那一节。
          git fetch --force origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
          $body = (git tag -l --format='%(contents:body)' $env:RELEASE_TAG | Out-String).Trim()
          $bullets = ($body -split "`r?`n" | Where-Object { $_ -match '^\s*- ' } | ForEach-Object { $_.Trim() }) -join "`n"
          if ($bullets) {
            $notes = "$install`n`n$bullets`n`n完整条目见 [CHANGELOG.md](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_TAG/CHANGELOG.md)。"
          } else {
            $version = $env:RELEASE_TAG -replace '^v', ''
            $changelog = Get-Content -Raw -Encoding utf8 'CHANGELOG.md'
            $pattern = '(?ms)^## ' + [regex]::Escape($version) + '\b.*?(?=^## |\z)'
            $section = [regex]::Match($changelog, $pattern).Value.Trim()
            $notes = if ($section) { "$install`n`n$section" } else { $install }
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'gakumas-mod-runtime-release.md'
          [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))

          $ghArgs = @(
            'release', 'create', $env:RELEASE_TAG, $env:ZIP_PATH,
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', $env:RELEASE_TAG,
            '--notes-file', $notesPath
          )
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
